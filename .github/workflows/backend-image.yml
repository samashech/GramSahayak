# Builds the backend container (Node gateway + RAG, see Dockerfile) and pushes it to GitHub
# Container Registry: ghcr.io/<owner>/gramsahayak-backend:{latest,<sha>}. Azure App Service pulls it.
name: backend-image
on:
  push:
    branches: [dev]
    paths: [Dockerfile, .dockerignore, deploy/**, backend/**, rag/**, data/seed/**, db/schema.sqlite.sql]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --no-audit --no-fund && npm test
        working-directory: backend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gramsahayak-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:latest,${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
